name: Release

# A tag such as v1.0 builds the Windows package and puts it on the release page.
# "Run workflow" builds the package without a release, to try the build.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python packaging/build_windows.py --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: Bewerbungstracker-Windows
          path: dist-package/Bewerbungstracker-Windows.zip
          retention-days: 14
      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<'NOTES'
          Der Bewerbungstracker läuft komplett auf deinem Computer. Deine Daten bleiben bei dir, es gibt kein Konto und nichts zu installieren.

          **Windows 10 und 11**

          1. Unten **Bewerbungstracker-Windows.zip** laden.
          2. Entpacken (Rechtsklick, Alle extrahieren), zum Beispiel nach Dokumente.
          3. **Tracker starten** doppelklicken. Der Browser öffnet sich von selbst.
          4. Beim ersten Mal zeigt Windows vielleicht eine Warnung, weil das Programm nicht von Microsoft geprüft ist. Auf **Weitere Informationen** und dann **Trotzdem ausführen** klicken.

          Deine Bewerbungen liegen danach im Ordner Bewerbungstracker in deinen Dokumenten. Zum Beenden das schwarze Fenster schließen.

          Die Dateien **Source code** am Ende der Liste sind nur für Entwickler.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist-package/Bewerbungstracker-Windows.zip --title "Bewerbungstracker $GITHUB_REF_NAME" --notes-file notes.md
